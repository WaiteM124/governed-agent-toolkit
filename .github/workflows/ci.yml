# Lint and test governed-agent-toolkit.
#
# Assumptions:
# - Python 3.12 in CI (project requires >=3.10; matches local contributor default).
# - ruff and pytest are pinned in requirements.txt / pyproject.toml [project.optional-dependencies] dev.
# - Flat layout: lint the repo root (source modules + tests + demo).
# - No evaluation suite exists yet; pytest alone is the quality gate.
#   An eval-gate job will be added when a cheap, deterministic eval suite lands.
# - This workflow does not deploy and does not use repository secrets.
# - ruff format --check is included because the tree is already formatted.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Verify pinned toolchain
        run: |
          ruff --version
          pytest --version
          python -c "import importlib.metadata as m; assert m.version('ruff') == '0.17.6', m.version('ruff')"
          python -c "import importlib.metadata as m; assert m.version('pytest') == '9.2.0', m.version('pytest')"

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests
        run: pytest tests/ -v
